[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aovguard"
version = "0.5.0"
description = "Pipeline tool for detecting empty or near-empty light AOVs from EXR sequences."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.8",
  "OpenEXR>=3.2.4",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
]

[project.scripts]
aovguard = "aovguard.cli:main"
aovguard-ui = "aovguard.ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=aovguard --cov-branch --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["src/aovguard"]
