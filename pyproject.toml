[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aovguard"
version = "1.0.0"
description = "EXR structure inspection and configurable AOV validation for VFX pipelines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Joshua A. Medina G." },
]
keywords = ["exr", "aov", "vfx", "rendering", "pipeline", "validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.8",
  "OpenEXR>=3.2.4",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
]

[project.scripts]
aovguard = "aovguard.cli:main"
aovguard-ui = "aovguard.ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=aovguard --cov-branch --cov-report=term-missing"

[tool.coverage.report]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/aovguard"]
